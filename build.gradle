plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

tasks.withType(JavaCompile).configureEach {
    it.sourceCompatibility = it.targetCompatibility = JavaVersion.toVersion(project.java_version)
    it.options.release = Integer.valueOf(project.java_version)
    it.options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
}

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def modVersion = project.version
def mcVersion = project.minecraft_version
def loaderVersion = project.fabric_loader_version
def apiVersion = project.fabric_api_version

processResources {
    filteringCharset = "UTF-8"
    filesMatching("fabric.mod.json") {
        filter { line -> line.replace("@mod_version@", modVersion) }
        filter { line -> line.replace("@minecraft_version@", mcVersion) }
        filter { line -> line.replace("@fabric_loader_version@", loaderVersion) }
        filter { line -> line.replace("@fabric_api_version@", apiVersion) }
    }
}

jar {
    from("LICENSE.txt")
    exclude('CREDITS.txt')
    exclude('assets')
    exclude('pack.mcmeta')
}

def artifactName(String type, String fileExt) {
    return "${project.name.toLowerCase()}-${project.version}+${project.minecraft_version}-${type}.${fileExt}"
}

jar.archiveFileName.set(artifactName('fabric', 'jar'))
jar.destinationDirectory.set(layout.buildDirectory.dir('dist'))

tasks.register('resourcePack', Zip) {
    archiveFileName = artifactName('resourcepack', 'zip')
    from(layout.buildDirectory.dir("resources/main")) {
        excludes = ['fabric.mod.json', '*.mixins.json']
    }
    destinationDirectory = layout.buildDirectory.dir('dist')
}
tasks.named("build") { finalizedBy("resourcePack") }

clean {
    delete "${rootDir}/remappedSrc"
    delete "${rootDir}/run"
}

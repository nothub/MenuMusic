name: '🧑‍🏭'
on: [ push, pull_request ]
permissions:
  contents: write
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v5

      - name: 'Find Java version'
        run: echo "JAVA_VERSION=$(cat gradle.properties | grep -oP '^java_version=(\K[0-9]+)')" >> $GITHUB_ENV

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          check-latest: true
          cache: 'gradle'

      - run: ./gradlew --console plain --no-daemon --full-stacktrace check build

      - name: 'Find Minecraft version'
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "MINECRAFT_VERSION=$(cat gradle.properties | grep -oP '^minecraft_version=(\K[0-9\.]+)')" >> $GITHUB_ENV

      - name: 'Find mod version'
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "MOD_VERSION=$(cat gradle.properties | grep -oP '^mod_version=(\K.+)')" >> $GITHUB_ENV

      - name: 'Find Fabric API version'
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "FABRIC_API_VERSION=$(cat fabric/gradle.properties | grep -oP '^fabric_api_version=(\K[0-9\.]+)')" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: '${{ github.ref_name }} (${{ env.MINECRAFT_VERSION }})'
          body: 'Release generated at commit: ${{ github.sha }}'
          generate_release_notes: true
          files: 'build/dist/*'

      - uses: Kir-Antipov/mc-publish@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          modrinth-id: 'To1L7Q0X'
          modrinth-token: '${{ secrets.MODRINTH_TOKEN }}'
          modrinth-featured: true
          modrinth-unfeature-mode: any
          curseforge-id: '1113116'
          curseforge-token: '${{ secrets.CURSEFORGE_TOKEN }}'
          version: '${{ env.MOD_VERSION }}'
          files: |
            build/dist/*-fabric.jar
            build/dist/*-resourcepack.zip
          loaders: 'fabric'
          game-versions: '${{ env.MINECRAFT_VERSION }}'
          dependencies: 'fabric@${{ env.FABRIC_API_VERSION }}(required){modrinth:P7dR8mSH}'

      - uses: Kir-Antipov/mc-publish@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          modrinth-id: 'To1L7Q0X'
          modrinth-token: '${{ secrets.MODRINTH_TOKEN }}'
          modrinth-featured: true
          modrinth-unfeature-mode: any
          curseforge-id: '1113116'
          curseforge-token: '${{ secrets.CURSEFORGE_TOKEN }}'
          version: '${{ env.MOD_VERSION }}'
          files: |
            build/dist/*-neoforge.jar
            build/dist/*-resourcepack.zip
          loaders: 'neoforge'
          game-versions: '${{ env.MINECRAFT_VERSION }}'
